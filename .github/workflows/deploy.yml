name: Deploy

on:
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check the Spotify client ID is configured
        env:
          CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::The repository variable VITE_SPOTIFY_CLIENT_ID is empty. Add it under Settings > Secrets and variables > Actions > Variables (see docs/deploy.md)."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
